[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "blurt"
dynamic = ["version"]
description = "Talk, don't type. Runs on-device on macOS Apple Silicon. No cloud, no API keys and forever free."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Satya Borgohain" }]
keywords = ["speech-to-text", "whisper", "mlx", "apple-silicon", "macos", "voice", "transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx-whisper",
    "sounddevice",
    "pynput",
    "numpy",
    "rich",
    "pyobjc-framework-ApplicationServices",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/satyaborg/blurt"

[project.scripts]
blurt = "blurt:main"

[tool.setuptools]
py-modules = ["blurt"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"blurt.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools_scm]
