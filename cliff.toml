[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/satyaborg/blurt/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/satyaborg/blurt/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
split_commits = false
commit_parsers = [
    { message = "^[Ff]ix", group = "Bug fixes" },
    { message = "^[Aa]dd", group = "Features" },
    { message = "^[Uu]pdate", group = "Changes" },
    { message = "^[Rr]ename", group = "Changes" },
    { message = "^[Rr]efactor", group = "Changes" },
    { message = "^[Rr]emove", group = "Changes" },
    { message = "^[Bb]ump", group = "Changes" },
    { message = "^[Mm]od", group = "Changes" },
    { message = "^[Mm]erge", skip = true },
    { message = "^.*", group = "Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
